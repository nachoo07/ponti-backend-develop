name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - dev  # Tu rama actual

env:
  SERVICE_NAME: ponti-api-dev # Le puse -dev para que coincida con tus logs anteriores
  REGION: us-central1
  REPO_NAME: backend-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Autenticación con Google
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 3. Configurar Docker
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 4. Construir y Subir Imagen
      - name: Build and Push
        id: build
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # 5. Migraciones (Opcional pero recomendado para verificar conexión DB)
      - name: Run Migrations
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
          ./cloud_sql_proxy -instances=${{ secrets.DB_INSTANCE_NAME }}=tcp:5432 &
          PID=$!
          sleep 5
          
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          
          # Ajusta la ruta 'projects/ponti-api/migrations' si es distinta
          migrate -path projects/ponti-api/migrations -database "postgres://postgres:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/${{ secrets.DB_NAME }}?sslmode=disable" up
          
          kill $PID

      # 6. Despliegue a Cloud Run (EL PASO CRÍTICO)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ steps.build.outputs.image }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ secrets.DB_INSTANCE_NAME }} \
            --set-env-vars="\
              DEPLOY_PLATFORM=gcp,\
              DEPLOY_ENV=dev,\
              GIN_MODE=debug,\
              HTTP_SERVER_PORT=8080,\
              DB_TYPE=postgres,\
              DB_HOST=/cloudsql/${{ secrets.DB_INSTANCE_NAME }},\
              DB_PORT=5432,\
              DB_NAME=${{ secrets.DB_NAME }},\
              DB_USER=postgres,\
              DB_PASSWORD=${{ secrets.DB_PASSWORD }},\
              DB_SSL_MODE=disable,\
              INSTANCE_CONNECTION_NAME=${{ secrets.DB_INSTANCE_NAME }},\
              API_VERSION=v1,\
              X_API_KEY=123456,\
              REDIS_ADDRESS=127.0.0.1:6379,\
              REDIS_PASSWORD=,\
              REDIS_DB=0" \
            --quiet