name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - dev

env:
  SERVICE_NAME: ponti-api-dev
  REGION: us-central1
  REPO_NAME: backend-dev      # ✅ Correcto

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Autenticación
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # 3. Configurar Docker
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 4. Construir y Subir
      - name: Build and Push
        id: build
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # 5. Migraciones
      - name: Run Migrations
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
          ./cloud_sql_proxy -instances=${{ secrets.DB_INSTANCE_NAME }}=tcp:5432 &
          PID=$!
          sleep 5
          
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          
          # Migraciones
          migrate -path projects/ponti-api/migrations -database "postgres://postgres:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/${{ secrets.DB_NAME }}?sslmode=disable" up
          
          kill $PID

      # 6. Despliegue (SIN VARIABLES DE REDIS)
            # 6. Despliegue (SIN VARIABLES DE REDIS)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ steps.build.outputs.image }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ secrets.DB_INSTANCE_NAME }} \
           --set-env-vars="\
              DEPLOY_PLATFORM=gcp,\
              DEPLOY_ENV=dev,\
              GO_ENVIRONMENT=development,\
              APP_ENV=development,\
              REPORT_SCHEMA=ponti_reports,\
              GIN_MODE=debug,\
              HTTP_SERVER_PORT=8080,\
              DB_TYPE=postgres,\
              DB_PORT=5432,\
              DB_NAME=${{ secrets.DB_NAME }},\
              DB_USER=postgres,\
              DB_PASSWORD=${{ secrets.DB_PASSWORD }},\
              INSTANCE_CONNECTION_NAME=${{ secrets.DB_INSTANCE_NAME }},\
              API_VERSION=v1,\
              X_API_KEY=f9eac0c8d3dbc828c9d8730446d902483917c465fa07889d87dc66934cc9b9cb,\
              \
              # TRUCO: IP falsa para satisfacer al código + Socket real inyectado en params \
              DB_HOST=/cloudsql/${{ secrets.DB_INSTANCE_NAME }}
              DB_SSL_MODE=disable&host=/cloudsql/${{ secrets.DB_INSTANCE_NAME }},\
              SSL_MODE=disable&host=/cloudsql/${{ secrets.DB_INSTANCE_NAME }}" \
            --quiet